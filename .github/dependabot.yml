version: 2
updates:
  # ─── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    target-branch: "main"

  # ─── NPM / pnpm workspace ────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    target-branch: "main"
    groups:
      # Agrupa o ecossistema Next.js num único PR
      nextjs:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react*"
      # Agrupa Prisma num único PR
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      # Agrupa TypeScript tooling num único PR
      typescript-tooling:
        patterns:
          - "typescript"
          - "@types/node"
          - "tsx"
          - "vitest"
          - "@vitest/*"
    ignore:
      # Sem versão corrigida acima de 3.0.3 no npm (GHSA-vfj7-8cjw-p6xm, dependência transitiva de build via tailwindcss)
      - dependency-name: "braces"
        versions: ["<=3.0.3"]
      # Bloqueia upgrades de versão major automática para pacotes core com breaking changes estruturais
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
