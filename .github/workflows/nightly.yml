# Workflow Noturno: E2E completo, testes de propriedade/matriz e mutação do domínio.
# Runtime Node.js 24 fixado nas versões major compatíveis.
name: Nightly

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-quality:
    name: Propriedades, Matriz e Concorrência
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gerar cliente Prisma
        run: pnpm db:generate
      - name: Build pacotes internos
        run: pnpm -r --filter=!@revezo/web build
      - name: Testes de Propriedade (fast-check)
        run: pnpm test:prop
      - name: Matriz Completa de Autorização
        run: pnpm test:matrix
      - name: Testes de Concorrência
        run: pnpm test:concurrency

  e2e-smoke:
    name: E2E e Acessibilidade (Playwright + Axe)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      NEXTAUTH_SECRET: "ci-secret-placeholder-exactly-32-c"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gerar cliente Prisma
        run: pnpm db:generate
      - name: Build pacotes internos
        run: pnpm -r --filter=!@revezo/web build
      - name: Instalar navegadores Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Executar testes de fumaça E2E
        run: pnpm test:e2e:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
