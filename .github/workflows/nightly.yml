# Workflow Noturno: E2E completo, testes de propriedade/matriz e mutação do domínio.
# Runtime Node.js 24 fixado nas versões major compatíveis.
name: Nightly

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-quality:
    name: Propriedades, Matriz e Concorrência
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gerar cliente Prisma
        run: pnpm db:generate
      - name: Build pacotes internos
        run: pnpm -r --filter=!@revezo/web build
      - name: Testes de Propriedade (fast-check)
        run: pnpm test:prop
      - name: Matriz Completa de Autorização
        run: pnpm test:matrix
      - name: Testes de Concorrência
        run: pnpm test:concurrency
      - name: Testes de Mutação (Stryker)
        run: pnpm test:mutation

  e2e-smoke:
    name: E2E e Acessibilidade (Playwright + Axe)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?schema=public"
      DIRECT_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?schema=public"
      AUTH_SECRET: "ci-secret-placeholder-exactly-32-c" # gitleaks:allow
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gerar cliente Prisma
        run: pnpm db:generate
      - name: Aplicar migrations do banco
        run: pnpm --filter @revezo/db exec prisma migrate deploy
      - name: Popular banco com dados de teste
        run: pnpm db:seed
      - name: Build pacotes internos
        run: pnpm -r --filter=!@revezo/web build
      - name: Instalar navegadores Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Executar testes de fumaça E2E
        run: pnpm test:e2e:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
