# CI principal — lint, typecheck, testes, build e auditoria de dependências.
# Actions fixadas na versão major mais recente compatível com Node.js 24 (runtime obrigatório desde 16/09/2026).
# Dependabot mantém as versões atualizadas semanalmente.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancela runs duplicadas do mesmo branch/PR para economizar minutos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── Job 1: Lint e Typecheck ─────────────────────────────────────────────────
  # Roda em paralelo com os outros jobs para feedback rápido.
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gerar cliente Prisma (necessário para tipos de @prisma/client)
        run: pnpm db:generate
      - name: Build dos pacotes internos (necessário para resolver @revezo/*)
        run: pnpm -r --filter=!@revezo/web build
      - run: pnpm lint
      - run: pnpm typecheck

  # ─── Job 2: Testes unitários e de integração ─────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?schema=public"
      DIRECT_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?schema=public"
      AUTH_SECRET: "ci-secret-placeholder-exactly-32-c" # gitleaks:allow
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gerar cliente Prisma
        run: pnpm db:generate
      - name: Aplicar migrations no banco de teste
        run: pnpm --filter @revezo/db exec prisma migrate deploy
      - name: Build dos pacotes internos
        run: pnpm -r --filter=!@revezo/web build
      - run: pnpm test

  # ─── Job 3: Build do Next.js ─────────────────────────────────────────────────
  # Depende de quality para não desperdiçar minutos com build se lint/typecheck falhar.
  # Usa env vars placeholder — o build não conecta ao banco em build-time.
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality]
    env:
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?schema=public"
      DIRECT_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?schema=public"
      AUTH_SECRET: "ci-secret-placeholder-exactly-32-c" # gitleaks:allow
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gerar cliente Prisma
        run: pnpm db:generate
      - name: Build dos pacotes internos
        run: pnpm -r --filter=!@revezo/web build
      - name: Build do Next.js
        run: pnpm --filter @revezo/web build

  # ─── Job 4: Auditoria de dependências ────────────────────────────────────────
  # Falha apenas em severidade high/critical (moderate documentado em tech-debt.md).
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
